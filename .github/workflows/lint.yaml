# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # hvtiRdatasets Imports hvtiRutilities, which is not on CRAN. Pull it
      # from GitHub explicitly so setup-r-dependencies doesn't try (and fail)
      # to resolve it from the public package repos.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lintr
            local::.
            github::ehrlinger/hvtiRutilities
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  # Catches generated documentation drifting from its roxygen sources, on the
  # PR rather than after the merge. Replaces a `devtools::document()` step that
  # ran inside R-CMD-check: regenerating docs before checking meant the check
  # could never see drift, because it had just fixed it. This one regenerates
  # and then *fails on the diff*.
  #
  # pull_request only. It is seconds, and does not build the manual, so the
  # CRAN check-time budget decision is untouched.
  docs-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned: it stamps its own version into DESCRIPTION, so
          # an unpinned upgrade fails this check on a version bump rather than
          # a doc change.
          extra-packages: |
            any::roxygen2@8.1.0
            local::.
            github::ehrlinger/hvtiRutilities

      - name: Documentation is current
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code man/ NAMESPACE DESCRIPTION

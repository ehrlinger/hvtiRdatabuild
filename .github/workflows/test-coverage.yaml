# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it is excluded from the built
  # package, and no step in this workflow reads it from the checkout. A push
  # that touches only .claude therefore skips this run.
  #
  # A pull request never skips it. This workflow reports a required status
  # check in the `protect main` ruleset, and a required check whose workflow
  # never starts never reports, so a .claude-only pull request waits on it
  # forever and cannot merge. ehrlinger/hvtiR#65, a house-style recompose, sat
  # at "Expected -- Waiting for status to be reported" for exactly that reason.
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # hvtiRdatabuild Imports hvtiRutilities, which is not on CRAN. Pull it
      # from GitHub explicitly so setup-r-dependencies doesn't try (and fail)
      # to resolve it from the public package repos.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            github::ehrlinger/hvtiRutilities
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          disable_search: true
          # Fail the build only when a token is configured and the upload
          # still errors -- a missing token should never fail CI. (The
          # prior `event_name != 'pull_request' || ...` form was
          # unconditionally true on every push regardless of token state,
          # defeating that intent.) A single `!=` comparison can only
          # ever evaluate to `true`/`false`.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it is excluded from the built
  # package, and no step in this workflow reads it from the checkout. A push
  # that touches only .claude therefore skips this run.
  #
  # A pull request never skips it. This workflow reports a required status
  # check in the `protect main` ruleset, and a required check whose workflow
  # never starts never reports, so a .claude-only pull request waits on it
  # forever and cannot merge. ehrlinger/hvtiR#65, a house-style recompose, sat
  # at "Expected -- Waiting for status to be reported" for exactly that reason.
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          rtools-version: '44'

      # hvtiRdatabuild Imports hvtiRutilities, which is not on CRAN. Pull it
      # from GitHub explicitly so setup-r-dependencies doesn't try (and fail)
      # to resolve it from the public package repos.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::ehrlinger/hvtiRutilities
          needs: check

      # Install the package into the user library so that Quarto's subprocess
      # can resolve library(hvtiRdatabuild) during vignette rendering on Windows.
      - name: Install package for vignette rendering
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

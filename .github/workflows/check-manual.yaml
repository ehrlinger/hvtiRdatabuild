# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs R CMD check --as-cran WITHOUT --no-manual, so the PDF manual is
# actually built. That step is what catches raw Unicode in .Rd files
# (Greek letters, combining marks) that --no-manual skips in silence.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: check-manual.yaml

permissions: read-all

jobs:
  check-manual:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # hvtiRdatasets Imports hvtiRutilities, which is not on CRAN. Pull it
      # from GitHub explicitly so setup-r-dependencies doesn't try (and fail)
      # to resolve it from the public package repos.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::ehrlinger/hvtiRutilities
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2

      # Install the package into the user library so that Quarto's subprocess
      # can resolve library(hvtiRdatasets) during vignette rendering.
      - name: Install package for vignette rendering
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it is excluded from the built
  # package, and no step in this workflow reads it from the checkout. A push
  # that touches only .claude therefore skips this run.
  #
  # A pull request never skips it. This workflow reports a required status
  # check in the `protect main` ruleset, and a required check whose workflow
  # never starts never reports, so a .claude-only pull request waits on it
  # forever and cannot merge. ehrlinger/hvtiR#65, a house-style recompose, sat
  # at "Expected -- Waiting for status to be reported" for exactly that reason.
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main]
  pull_request:
  # No `release:` trigger, deliberately. A release here tags a commit that is
  # already on main, and the push that merged it has already built and deployed
  # it. A release-triggered run can only repeat that deploy or, when main has
  # moved on, overwrite the site with an older commit: hvtiRlifetables v0.1.3
  # (tagged at f024064) did that on 2026-09-11 and rolled the live help pages
  # back past the ehrlinger/hvtiRlifetables#20 fix. The site documents main.
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # hvtiRdatabuild Imports hvtiRutilities, which is not on CRAN. Pull it
      # from GitHub explicitly so setup-r-dependencies doesn't try (and fail)
      # to resolve it from the public package repos.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            github::ehrlinger/hvtiRutilities
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

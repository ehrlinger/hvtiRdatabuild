url: https://ehrlinger.github.io/hvtiRdatabuild/

template:
  bootstrap: 5
  light-switch: true

reference:
- title: "Package Overview"
  desc: >
    Package-level documentation: what the package builds, who it's for,
    and how the verify workflow fits together.
  contents:
  - hvtiRdatabuild-package

- title: "Verify: R Build vs. SAS Oracle"
  desc: >
    Freeze a SAS-built dataset as a checksummed parquet oracle, then compare
    an R-built dataset against it. Use `snapshot_oracle()` once per legacy
    SAS dataset to create the frozen reference; use `compare_built()` for
    every R rebuild you want to verify against it.
  contents:
  - snapshot_oracle
  - compare_built
  - print.built_comparison
  - str.built_comparison

- title: "Pull: Warehouse to R"
  desc: >
    Read a study's configuration, open a credentialed warehouse connection,
    and pull the modules the study declares. The pull is read-only.
  contents:
  - read_study_config
  - dw_connect
  - dw_modules
  - dw_pull
  - print.pull_result

- title: "Pull: Master views to a study"
  desc: >
    Define a cohort of encounters, select and pull it from a master view in one consistent
    read, build from the pull, and freeze it with its provenance.
  contents:
  - cohort_unit_id
  - split_cohort_unit
  - cohort_query
  - print.cohort_query
  - pull_master
  - print.master_pull
  - str.master_pull
  - build_from_master
  - freeze_study_pull
  - read_pull_provenance

- title: "Pull: Cohort criteria"
  desc: >
    Declare inclusion and exclusion criteria for a cohort query. Each is evaluated in
    the warehouse inside the pull, counted as its own stage, and states every clinical
    choice itself.
  contents:
  - criterion
  - master_row
  - view_rows
  - any_of
  - local_criterion
  - review_criterion
  - review_list
  - apply_review

- title: "Build: Assemble and Derive"
  desc: >
    Join the pulled modules into a study's built dataset, run its study-specific
    derivation code, and carry the cohort's inclusion and exclusion history
    through both in order.
  contents:
  - build_dataset
  - derive_vars
  - new_cohort_record
  - append_cohort_stage
  - cohort_summary
  - print.build_result
  - str.build_result
  - print.derive_result
  - str.derive_result
  - str.cohort_record

- title: "Analysis sets"
  desc: >
    Write and read declared, checkpointed selections of a study's built dataset.
  contents:
  - write_analysis_set
  - read_analysis_set

- title: "Dataset publication"
  desc: >
    Turn a mutable draft into an immutable dated release, or withdraw a release
    without changing its bytes.
  contents:
  - publish_dataset
  - withdraw_dataset_release

- title: Master datasets
  desc: Snapshot and lift the master datasets studies read.
  contents:
  - read_master_config
  - snapshot_master
  - lift_master

- title: "Corrections to source views (interim)"
  desc: >
    Interim intake for corrections to warehouse source views, superseded by the HVTR
    registry, which takes over the template and the tables unchanged.
  contents:
  - generate_corrections_sql
  - write_corrections_template
  - propose_corrections
  - decide_corrections
  - retire_filled_corrections
  - study_correction_candidates
- title: Deprecated
  desc: >
    Corrections to master datasets move to the HVTR registry; this package will
    read corrected data from it. These still work and warn on every call.
  contents:
  - backfill_corrections
  - propose_correction
  - decide_correction

articles:
- title: "Getting Started"
  contents:
  - coming-from-sas
  - master-datasets

footer:
  structure:
    left: developed_by
    right: built_with_pkgdown
  components:
    developed_by: "John Ehrlinger"
    built_with_pkgdown: "This site was built using [pkgdown](https://pkgdown.r-lib.org/)!&nbsp;&nbsp;<img src='https://pkgdown.r-lib.org/logo.png' alt='pkgdown logo' width='25'>"
